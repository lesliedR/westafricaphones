name: Deploy to Krystal (Zero Downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Krystal
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          RELEASE_DIR="/home/westafr1/releases/$TIMESTAMP"
          CURRENT_DIR="/home/westafr1/current"
          PROJECT_DIR="/home/westafr1/westafricaphones"
          BACKUP_DIR="/home/westafr1/backups"

          ssh -p 722 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

          # Create release + backup directories if missing
          mkdir -p /home/westafr1/releases
          mkdir -p /home/westafr1/backups

          # Create new release folder
          mkdir -p $RELEASE_DIR

          # Copy repo into release folder
          cp -R $PROJECT_DIR/* $RELEASE_DIR/

          # Move into release folder
          cd $RELEASE_DIR

          # Install PHP dependencies
          composer install --no-dev --prefer-dist --no-interaction

          # Backup database BEFORE updates
          mysqldump -u westafr1 -p"${{ secrets.DB_PASSWORD }}" westafr1_westafricaphones > $BACKUP_DIR/db-$TIMESTAMP.sql

          # Run database updates
          php $RELEASE_DIR/web/core/scripts/drupal updb -y

          # Switch symlink atomically
          ln -sfn $RELEASE_DIR $CURRENT_DIR

          # Clear caches
          php $CURRENT_DIR/web/core/scripts/drupal cache:rebuild

          EOF
