name: Deploy to Krystal (Zero Downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Krystal
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")

          PROJECT_DIR="/home/westafr1/westafricaphones"
          RELEASE_DIR="/home/westafr1/releases/$TIMESTAMP"
          CURRENT_DIR="/home/westafr1/current"
          BACKUP_DIR="/home/westafr1/backups"

          sshpass -p "$SSH_PASSWORD" ssh -p 722 -o StrictHostKeyChecking=no westafr1@planck.krystal.uk << EOF
mkdir -p "$RELEASE_DIR"
mkdir -p "$BACKUP_DIR"

cp -R "$PROJECT_DIR"/* "$RELEASE_DIR"/

cd "$RELEASE_DIR"

composer install --no-dev --prefer-dist --no-interaction --no-scripts

mysqldump -u westafr1_westafricaphones -p"$DB_PASSWORD" westafr1_westafricaphones > "$BACKUP_DIR/db-$TIMESTAMP.sql"

php "$RELEASE_DIR/web/core/scripts/drupal" updb -y

ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

php "$CURRENT_DIR/web/core/scripts/drupal" cache:rebuild
EOF
