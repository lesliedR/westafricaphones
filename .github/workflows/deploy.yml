name: Deploy to Krystal (Zero Downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies locally (no dev)
        run: |
          composer install --no-dev --prefer-dist --no-interaction

      - name: Create clean build directory
        run: |
          mkdir build
          cp -R . build/

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Build and deploy archive to Krystal
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          ARCHIVE="release-$TIMESTAMP.tar.gz"

          # Paths on Krystal
          REMOTE_RELEASE_DIR="/home/westafr1/releases/$TIMESTAMP"
          REMOTE_CURRENT_DIR="/home/westafr1/current"
          REMOTE_BACKUP_DIR="/home/westafr1/backups"

          # Create archive from clean build directory
          tar -czf "$ARCHIVE" -C build .

          # Prepare directories on Krystal
          sshpass -p "$SSH_PASSWORD" ssh -p 722 -o StrictHostKeyChecking=no westafr1@planck.krystal.uk "
            mkdir -p \"$REMOTE_RELEASE_DIR\" \"$REMOTE_BACKUP_DIR\"
          "

          # Upload archive to Krystal
          sshpass -p "$SSH_PASSWORD" scp -P 722 "$ARCHIVE" westafr1@planck.krystal.uk:\"$REMOTE_RELEASE_DIR/\"

          # Unpack and run Drupal commands on Krystal
          sshpass -p "$SSH_PASSWORD" ssh -p 722 -o StrictHostKeyChecking=no westafr1@planck.krystal.uk "
            cd \"$REMOTE_RELEASE_DIR\"
            tar -xzf \"$ARCHIVE\"

            mysqldump -u westafr1_westafricaphones -p\"$DB_PASSWORD\" westafr1_westafricaphones > \"$REMOTE_BACKUP_DIR/db-$TIMESTAMP.sql\"

            php web/core/scripts/drupal updb -y

            ln -sfn \"$REMOTE_RELEASE_DIR\" \"$REMOTE_CURRENT_DIR\"

            php \"$REMOTE_CURRENT_DIR/web/core/scripts/drupal\" cache:rebuild
          "
